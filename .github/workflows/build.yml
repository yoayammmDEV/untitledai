name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract zip
        run: |
          ZIP_NAME=$(ls *.zip | head -n 1)
          echo "Unzipping $ZIP_NAME"
          unzip -q "$ZIP_NAME"
          DIR_NAME=$(find . -maxdepth 1 -mindepth 1 -type d ! -name ".*" | head -n 1)
          if [ -n "$DIR_NAME" ]; then
            cp -r "$DIR_NAME"/* . 2>/dev/null || true
            cp -r "$DIR_NAME"/.* . 2>/dev/null || true
          fi
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Find and Move APK
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path
          : output/
